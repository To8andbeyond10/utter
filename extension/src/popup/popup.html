<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClariFi</title>
<link rel="stylesheet" href="../shared/ui.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="head">
  <span class="brand"><img src="../../icons/icon32.png" alt="" width="22" height="22">ClariFi</span>
  <label class="switch" title="Turn ClariFi on or off everywhere">
    <input type="checkbox" id="enabled"><span class="track" aria-hidden="true"></span><span class="sr">ClariFi on</span>
  </label>
</header>

<section class="hero" id="site-panel" hidden>
  <div class="hero-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none">
      <path d="M12 2.5 20 6v6c0 5-3.4 8.3-8 9.5C7.4 20.3 4 17 4 12V6l8-3.5Z" fill="var(--brand)" opacity=".14"/>
      <path d="M12 2.5 20 6v6c0 5-3.4 8.3-8 9.5C7.4 20.3 4 17 4 12V6l8-3.5Z" stroke="var(--brand)" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="m8.8 12 2.2 2.2 4.2-4.4" stroke="var(--brand)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <p class="hero-site" id="site-name"></p>
  <p class="hero-count" id="count"></p>
  <div class="seg" role="radiogroup" aria-label="Level on this site" id="levels">
    <button type="button" role="radio" data-level="off">Off</button>
    <button type="button" role="radio" data-level="inform">Inform</button>
    <button type="button" role="radio" data-level="warn">Warn</button>
    <button type="button" role="radio" data-level="block">Block</button>
  </div>
  <p class="note muted" id="level-note"></p>
</section>

<section class="panel" id="no-site" hidden>
  <p class="muted">Open YouTube, TikTok, Instagram, X, Facebook, Threads or Reddit to see ClariFi at work. Already there? Reload the page once after installing.</p>
</section>

<section class="panel pause">
  <p class="pause-state" id="pause-state">Take a break from filtering:</p>
  <div class="row" id="pause-buttons">
    <button class="btn" type="button" data-pause="15">15 min</button>
    <button class="btn" type="button" data-pause="60">1 hour</button>
    <button class="btn" type="button" data-pause="forever">Until I resume</button>
  </div>
  <button class="btn primary" type="button" id="resume" hidden>Resume now</button>
</section>

<footer class="foot">
  <a href="#" id="open-options">All settings</a>
  <span class="muted">v0.1.0</span>
</footer>
<script src="../shared/settings.js"></script>
<script src="popup.js"></script>
</body>
</html>
